[package]
name = "editor-core"
version = "0.1.0"
description = "Shared HammeRR application, editing session and optional MCP service"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
mcp = ["dep:axum", "dep:base64", "dep:png", "dep:rmcp", "dep:tokio"]
test-support = []

[[bin]]
name = "hammerr-headless"
path = "src/bin/headless.rs"
required-features = ["mcp"]

[dependencies]
compiler = { path = "../compiler" }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
axum = { version = "0.8.9", optional = true }
base64 = { version = "0.23.1", optional = true }
glam.workspace = true
map-core.workspace = true
png = { version = "0.18.1", optional = true }
render.workspace = true
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"], optional = true }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
source-formats.workspace = true
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "io-std"], optional = true }
tempfile = "3.27.0"
