[package]
name = "render"
version = "0.1.0"
description = "wgpu renderer for Source maps, independent of the editor UI"
edition.workspace = true
rust-version.workspace = true
autotests = false
autobenches = false

[lib]
test = false
doctest = false
bench = false

[dependencies]
bytemuck.workspace = true
glam.workspace = true
half = "2.7.1"
map-core.workspace = true
pollster = "1.0.1"
png = "0.18.1"
source-formats.workspace = true
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
wgpu = "30"
