[package]
name = "compiler"
version = "0.1.0"
description = "Compiles VMF maps into Source engine BSP files"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hammerr-compile"
path = "src/main.rs"

[[bin]]
name = "hammerr-physics"
path = "src/physics_main.rs"

[dependencies]
glam.workspace = true
map-core.workspace = true
source-formats.workspace = true
thiserror.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
libloading = "0.8.9"
libc = "0.2.190"
sha2 = "0.10.9"
