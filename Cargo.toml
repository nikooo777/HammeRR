[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
glam = "0.34.1"
thiserror = "2.0.21"
source-formats = { path = "crates/source-formats" }
map-core = { path = "crates/map-core" }
render = { path = "crates/render" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "accessibility", "compat-1-2"] }

slint-build = "=1.18.1"
# Share the font-cache feature with software tests without adding a renderer.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["shared-swash"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.dev.package.editor-ui]
opt-level = 0
debug = 0
incremental = false

[profile.test.package.editor-ui]
opt-level = 0
debug = 0
incremental = false

[profile.dev.package.editor-app-ui]
opt-level = 0
debug = 0
incremental = false

[profile.test.package.editor-app-ui]
opt-level = 0
debug = 0
incremental = false

[profile.dev.package.editor-build-ui]
opt-level = 0
debug = 0
incremental = false

[profile.test.package.editor-build-ui]
opt-level = 0
debug = 0
incremental = false

[profile.dev.package.editor-core]
debug = "line-tables-only"
incremental = false

[profile.test.package.editor-core]
debug = "line-tables-only"
incremental = false

[profile.dev.package.compiler]
debug = "line-tables-only"

[profile.test.package.compiler]
debug = "line-tables-only"

[profile.dev.package.render]
debug = "line-tables-only"

[profile.test.package.render]
debug = "line-tables-only"

[profile.dev.package.editor]
debug = "line-tables-only"

[profile.test.package.editor]
debug = "line-tables-only"
