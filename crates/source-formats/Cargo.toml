[package]
name = "source-formats"
version = "0.1.0"
description = "Readers and writers for Source engine file formats (KeyValues, VMF, ...)"
edition.workspace = true
rust-version.workspace = true
autotests = false
autobenches = false

[lib]
test = false
doctest = false
bench = false

[dependencies]
bytemuck.workspace = true
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
glam.workspace = true
thiserror.workspace = true
tempfile = "3.27.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
png = "0.18.1"
