[package]
name = "editor"
version = "0.1.0"
description = "HammeRR, a map editor for Source engine games"
edition.workspace = true
rust-version.workspace = true
autotests = false
autobenches = false

[[bin]]
name = "editor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
editor-core = { path = "../editor-core", features = ["mcp"] }
editor-ui = { path = "../editor-ui" }
compiler = { path = "../compiler" }
glam.workspace = true
map-core.workspace = true
render.workspace = true
rfd = "0.17.2"
serde_json = "1.0.151"
slint.workspace = true
source-formats.workspace = true
tokio = { version = "1.53.2", features = ["sync", "net", "io-util", "time"] }

[build-dependencies]
winresource = "0.1.31"
